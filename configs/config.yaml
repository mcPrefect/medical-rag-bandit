# System Configuration

# Experiment Settings
experiment:
  name: "medical_rag_system"
  n_examples: 1000
  random_seed: 147
  
# Data Paths
data:
  pubmedqa_path: "data/pubmedqa/ori_pqal.json"
  output_dir: "results/"
  
# LLM Settings
llm:
  model_name: "Qwen/Qwen2.5-14B-Instruct"
  device: "cuda"
  max_new_tokens: 50
  
# Retrieval Arms
retrieval:
  fast_arm:
    top_k: 3
  deep_arm:
    top_k: 5
    model_name: "all-MiniLM-L6-v2"
  kg_arm:
    top_k: 5
    model_path: "models/gnn_model_best.pt"
    graph_path: "data/umls/subgraph.pkl"
    concepts_path: "data/umls/concepts.pkl"
    features_path: "data/umls/node_features.npy"
    k_hops: 2
    device: "cuda"
    
# Bandit Settings
bandit:
  n_arms: 3
  n_features: 10
  alpha: 2.0
  
# Reward Function 
reward:
  w_guideline: 0.55         
  w_quality: 0.25            
  w_latency: 0.10            
  w_safety: 0.10             
  time_budget: 10.0          
  safety_kill_switch: true   
  use_bertscore: true        
  
  guideline_model: "pritamdeka/S-PubMedBert-MS-MARCO"
  # Legacy field kept for backward compat
  # latency_penalty_weight: 0.1
  
# Safety Validator
safety:
  enabled: true
  confidence_threshold: 0.7
  min_evidence_sentences: 2
  min_evidence_words_per_sentence: 5
  
# Logging
logging:
  verbose: true

off_policy:
  ips_cap: 5.0
  improvement_threshold: 0.02
  n_bootstrap: 1000


thompson:
  reward_threshold: 0.5